(function(){
  window.__loadSupabase=function(){
    if(window.supabase)return Promise.resolve(window.supabase);
    if(window.__supabaseLoading)return window.__supabaseLoading;
    window.__supabaseLoading=new Promise(function(resolve){
      var finished=false;
      function done(v){if(!finished){finished=true;resolve(v)}}
      var s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      s.async=true;
      s.onload=function(){done(window.supabase||null)};
      s.onerror=function(){done(null)};
      setTimeout(function(){done(window.supabase||null)},6000);
      document.head.appendChild(s);
    });
    return window.__supabaseLoading;
  };
})();
</script>

async function encryptCloud(data,password){let iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveCloudKey(password),plain=new TextEncoder().encode(JSON.stringify(data)),cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain);return JSON.stringify({v:1,iv:bytesToB64(iv),data:bytesToB64(cipher)})}
async function decryptCloud(payload,password){let o=JSON.parse(payload),key=await deriveCloudKey(password),plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(o.iv)},key,b64ToBytes(o.data));return JSON.parse(new TextDecoder().decode(plain))}
async function cloudSave(){if(!supabaseClient||cloudSyncing||!cloudPassword||!db.account?.code)return;cloudSyncing=true;try{let payload=await encryptCloud(db,cloudPassword);let {error}=await supabaseClient.from("teacher_app_data").upsert({account_code:db.account.code,payload,updated_at:new Date().toISOString()},{onConflict:"account_code"});if(error)console.error("Supabase save:",error)}catch(e){console.error("Supabase save:",e)}finally{cloudSyncing=false}}
async function cloudLoad(password,accountCode){if(!supabaseClient||!password||!accountCode)return false;try{let {data,error}=await supabaseClient.from("teacher_app_data").select("payload").eq("account_code",accountCode).maybeSingle();if(error){console.error("Supabase load:",error);return false}if(!data?.payload)return false;let remote=await decryptCloud(data.payload,password);mergeDB(remote);localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){console.error("Supabase decrypt:",e);return false}}

async function getServerTrial(accountCode){
  try{
    let {data,error}=await supabaseClient.from("trial_profiles").select("trial_started_at").eq("account_code",accountCode).maybeSingle();
    if(error) throw error;
    if(data?.trial_started_at){db.meta={...(db.meta||{}),trialStartedAt:data.trial_started_at};return true;}
    let start=new Date().toISOString();
    await supabaseClient.from("trial_profiles").insert({account_code:accountCode,trial_started_at:start});
    db.meta={...(db.meta||{}),trialStartedAt:start};
    return true;
  }catch(e){console.error("Trial sync:",e);return false;}
}

function forgotPassword(){
  let phone=prompt("اكتب رقم الهاتف لاستعادة كلمة المرور:");
  if(!phone)return;
  phone=String(phone).trim();
  let acc=(db.accounts||[]).find(a=>a.phone===phone) || (db.account&&db.account.phone===phone?db.account:null);
  if(!acc){alert("لا يوجد حساب بهذا الرقم.");return;}
  let otp=String(Math.floor(100000+Math.random()*900000));
  db.passwordResets=Array.isArray(db.passwordResets)?db.passwordResets:[];
  db.passwordResets=db.passwordResets.filter(x=>x.phone!==phone);
  db.passwordResets.push({phone:phone,otp:otp,expiresAt:Date.now()+300000});
  save();
  let entered=prompt("تم تجهيز كود SMS (بعد ربط مزود الرسائل سيصل للهاتف). أدخل الكود:");
  if(entered!==otp){alert("الكود غير صحيح أو منتهي.");return;}
  let np=prompt("اكتب كلمة المرور الجديدة:");
  if(!np){return;}
  if(db.accounts){let a=db.accounts.find(x=>x.phone===phone); if(a)a.passwordHash=hashPassword(np);}
  if(db.account&&db.account.phone===phone)db.account.passwordHash=hashPassword(np);
  save();
  alert("تم تغيير كلمة المرور بنجاح.");
}

function ensureAccess(){if(!isLoggedIn()){loginModal();return false}if(!trialInfo().active){subscriptionModal();return false}return true}
function student(id){return db.students.find(x=>x.id===id)}
function group(id){return db.groups.find(x=>x.id===id)}
function groupTitle(id){let g=group(id);return g?g.name||`${g.grade} - ${g.subject}`:"بدون مجموعة"}
function stats(id){
 let a=db.attendance.filter(x=>x.studentId===id), h=db.homework.filter(x=>x.studentId===id), g=db.grades.filter(x=>x.studentId===id), p=db.payments.filter(x=>x.studentId===id);
 let paid=p.reduce((s,x)=>s+Number(x.amount||0),0), total=Math.max(0,...p.map(x=>Number(x.total||0)));
 return {a,h,g,p, present:a.filter(x=>x.status==="present").length,absent:a.filter(x=>x.status==="absent").length,paid,total,remaining:Math.max(0,total-paid)}

function normalizePhone(v){
 let p=String(v||"").replace(/\D/g,""); if(p.startsWith("00"))p=p.slice(2); if(p.startsWith("0"))p="20"+p.slice(1); return p
}
function whatsapp(phone,text){
 let p=normalizePhone(phone);
 let u="https://wa.me/"+(p?p+"?":"?")+"text="+encodeURIComponent(text);
 // APK/WebView safe: do not use window.open or Web Share API.
 // Opening the URL in the same WebView lets Android/AppCreator24 hand it off to WhatsApp.
 try { window.location.href=u; }
 catch(e) { window.open(u,"_blank"); }
}

function followupDateKey(y,m,d){return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function followupMonthDays(y,m){let n=new Date(y,m,0).getDate(),a=[];for(let d=1;d<=n;d++)a.push(d);return a}
function followupWeekday(dateKey){let d=new Date(dateKey+"T12:00:00"),name=d.toLocaleDateString("ar-EG",{weekday:"long"});return DAYS.find(x=>name.includes(x))||name}
function followupRecord(studentId,dateKey){return (db.dailyFollowup||[]).find(x=>x.studentId===studentId&&x.date===dateKey)}
function followupGet(studentId,dateKey,key){let r=followupRecord(studentId,dateKey);return r?.[key]||"pending"}
function followupDisplayDate(dateKey){try{return new Date(dateKey+"T12:00:00").toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return dateKey}}
async function followupSet(studentId,dateKey,key,value){
 if(!Array.isArray(db.dailyFollowup))db.dailyFollowup=[];let r=followupRecord(studentId,dateKey);

 r[key]=value;save();followupRender();try{const s=student(studentId);if(s)await publishStudentPublic(s)}catch(e){console.warn('followup publish',e)}
}

function followupRender(){
  const box=document.getElementById('followup');
  if(!box) return;
  try{
    if(!Array.isArray(db.dailyFollowup)) db.dailyFollowup=[];
    if(!Array.isArray(db.groups)) db.groups=[];
    if(!Array.isArray(db.students)) db.students=[];
    const now=new Date();
    const y=Number(window.followupYear)||now.getFullYear();
    const m=Number(window.followupMonth)||now.getMonth()+1;
    let dateKey=window.followupDate||followupDateKey(y,m,now.getDate());
    const gid=window.followupGroup||'';
    const selectedGroup=gid?group(gid):null;
    const sessions=selectedGroup && Array.isArray(selectedGroup.sessions)?selectedGroup.sessions:[];
    const validDays=followupMonthDays(y,m);
    if(!validDays.length) validDays.push(1);
    const currentDay=Number(String(dateKey).slice(-2));
    if(!validDays.includes(currentDay)) dateKey=followupDateKey(y,m,validDays[0]);
    window.followupDate=dateKey;
    const students=db.students.filter(function(st){return !gid || st.groupId===gid;});
    const monthNames=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const daysHtml=validDays.map(function(d){
      const k=followupDateKey(y,m,d),wd=followupWeekday(k);
      return '<button type="button" class="followup-day '+(k===dateKey?'active':'')+'" onclick="window.followupDate=\''+k+'\';followupRender()">'+d+'<small>'+esc(wd)+'</small></button>';
    }).join('');
    const groupOptions=db.groups.map(function(gx){return '<option value="'+esc(gx.id)+'" '+(gid===gx.id?'selected':'')+'>'+esc(gx.name||((gx.grade||'')+' - '+(gx.subject||'')))+'</option>';}).join('');
    const studentsHtml=students.length?students.map(function(st){
      const r=followupRecord(st.id,dateKey)||{};
      const lv=r.level&&r.level!=="pending"?({excellent:"ممتاز",verygood:"جيد جدًا",good:"جيد",acceptable:"مقبول",needs:"يحتاج متابعة"}[r.level]||r.level):"المستوى غير مسجل";
      return '<div class="followup-student"><div class="followup-student-head"><div><h3>'+esc(st.name||'طالب')+'</h3><div class="small">'+esc(groupTitle(st.groupId))+'</div></div><span class="badge purple">'+esc(lv)+'</span></div><div class="followup-items">'+followupStatusButton(st.id,dateKey,'attendance','الحضور')+followupStatusButton(st.id,dateKey,'homework','الواجب')+followupStatusButton(st.id,dateKey,'recitation','التسميع')+followupStatusButton(st.id,dateKey,'level','المستوى')+followupStatusButton(st.id,dateKey,'focus','التركيز')+'</div>'+((r.notes)?'<div class="followup-note"><b>📝 ملاحظة:</b> '+esc(r.notes)+'</div>':'')+'<div class="followup-actions"><button type="button" class="btn secondary" onclick="followupNoteModal(\''+st.id+'\',\''+dateKey+'\')">📝 ملاحظة اليوم</button><button type="button" class="btn whatsapp" onclick="sendDailyParentReport(\''+st.id+'\',\''+dateKey+'\')">💬 إرسال تقرير ولي الأمر</button></div>'+followupExamInfo(st.id,dateKey)+'</div>';
    }).join(''):'<div class="card empty">لا يوجد طلاب في المجموعة المختارة.</div>';
    box.innerHTML='<div class="hero"><h1>📋 المتابعة اليومية</h1><p>متابعة الحضور والواجب والتسميع والامتحانات والتفاعل لكل طالب.</p></div>'+ 
      '<div class="followup-toolbar"><div class="grid3">'+
      '<div><label>الشهر</label><select onchange="window.followupMonth=Number(this.value);window.followupDate=\'\';followupRender()">'+monthNames.map(function(n,i){return '<option value="'+(i+1)+'" '+(m===i+1?'selected':'')+'>'+n+'</option>';}).join('')+'</select></div>'+ 
      '<div><label>السنة</label><select onchange="window.followupYear=Number(this.value);window.followupDate=\'\';followupRender()"><option value="'+(y-1)+'">'+(y-1)+'</option><option value="'+y+'" selected>'+y+'</option><option value="'+(y+1)+'">'+(y+1)+'</option></select></div>'+ 
      '<div><label>المجموعة</label><select onchange="window.followupGroup=this.value;window.followupDate=\'\';followupRender()"><option value="">كل المجموعات</option>'+groupOptions+'</select></div>'+ 
      '</div>'+(selectedGroup?'<div class="followup-group"><b>📚 '+esc(selectedGroup.name||selectedGroup.grade||'المجموعة')+'</b><div class="small">'+esc(selectedGroup.subject||'')+' • مواعيد المجموعة: '+sessions.map(function(x){return esc(x.day||'')+' '+esc(x.time||'')}).join(' — ')+'</div></div>':'<div class="notice">اختر مجموعة لعرض مواعيدها وأيام المتابعة، أو اتركها لعرض كل الطلاب.</div>')+ 
      '<div class="section-title" style="margin-top:12px">أيام المتابعة</div><div class="followup-days">'+daysHtml+'</div></div>'+ 
      '<div class="followup-date-title"><span>📅 '+esc(followupDisplayDate(dateKey))+'</span><small>كل تعديل محفوظ بتاريخ هذا اليوم</small></div>'+'<div class="section-title"><span>👨‍🎓 الطلاب <span class="badge blue">'+students.length+'</span></span></div>'+studentsHtml;
  }catch(err){
    console.error('Followup render error:',err);
    box.innerHTML='<div class="card empty"><h2>تعذر فتح المتابعة اليومية</h2><p>'+esc(err.message||String(err))+'</p><button type="button" class="btn primary" onclick="followupRender()">إعادة المحاولة</button></div>';
  }
}

async function examImageData(file){
 if(!file)return '';
 try{
  const data=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file);});
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data});
  const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.82);
 }catch(e){console.warn('image data',e);return '';}
}
function dataUrlToFile(dataUrl,name){
 if(!dataUrl||!dataUrl.startsWith('data:'))return null;
 const parts=dataUrl.split(','),meta=parts[0],b64=parts[1]||'';
 const mime=(meta.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
 const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
 return new File([u8],name,{type:mime});
}
async function uploadExamImage(file){

 try{let name="exams/"+Date.now()+"_"+String(file.name||"exam.jpg").replace(/[^a-zA-Z0-9._-]/g,"_");let {error}=await supabaseClient.storage.from("exam-images").upload(name,file,{upsert:true});if(error)throw error;return supabaseClient.storage.from("exam-images").getPublicUrl(name).data.publicUrl}catch(e){console.warn("image upload",e);return ""}
}

async function syncSubscriptionStatus(showMessage=false){
  if(!db.account?.code)return false;
  try{
    let {data,error}=await supabaseClient.from("subscriptions").select("id,account_code,status,plan,start_date,end_date,created_at").eq("account_code",db.account.code).order("created_at",{ascending:false}).limit(1).maybeSingle();
    if(error)throw error;
    if(!data)return false;
    db.subscription={...data};
    if(data.status==="active"&&data.end_date){
      let end=new Date(data.end_date);
      if(!Number.isNaN(end.getTime())){db.settings.appPaidUntil=end.toISOString();db.settings.appPlan=data.plan||"term";localStorage.setItem(KEY,JSON.stringify(db));if(showMessage)alert("✅ تم تفعيل اشتراكك بنجاح حتى "+end.toLocaleDateString("ar-EG"));return true;}
    }
    return false;
  }catch(e){console.warn("Subscription sync failed:",e);return false}
}
async function requestSubscription(){
  let plan=$("appPlan").value;if(!db.account?.code){alert("لا يوجد كود حساب.");return}

    if(oldRequest){whatsapp(SUBSCRIPTION_WHATSAPP,`السلام عليكم 🌷\n\nلدي طلب اشتراك قيد المراجعة بالفعل.\nكود الحساب: ${db.account.code}\nرقم الطلب في النظام: ${oldRequest.id||"موجود"}\nالباقة: ${subscriptionPlanLabel(oldRequest.plan)}\n\nأرجو مراجعة الطلب وتفعيل الاشتراك بعد إتمام الدفع.`);alert("يوجد طلب سابق قيد المراجعة، وتم فتح واتساب للإدارة.");return}
    let {data,error}=await supabaseClient.from("subscriptions").insert({account_code:db.account.code,status:"pending",plan:plan,created_at:new Date().toISOString()}).select("id,account_code,status,plan,start_date,end_date,created_at").single();
    if(error){console.error(error);alert("حدث خطأ أثناء حفظ الطلب في Supabase.\n\n"+(error.message||error));return}
    db.account.subscriptionRequestedAt=new Date().toISOString();db.account.requestedPlan=plan;db.account.requestCode=requestCode;db.subscription={...data,request_code:requestCode};save();
    let msg=`السلام عليكم ورحمة الله وبركاته 🌷\n\nأرغب في الاشتراك في برنامج مساعد المعلم.\n\n📦 الباقة: ${subscriptionPlanLabel(plan)}\n💰 السعر: ${APP_PLANS[plan]} جنيه\n🔑 كود الحساب: ${db.account.code}\n🧾 كود الطلب: ${requestCode}\n📱 رقم الهاتف: ${db.account.phone}\n\nتم حفظ الطلب في النظام، وأرجو تأكيد الدفع وتفعيل الاشتراك من Supabase.`;
    whatsapp(SUBSCRIPTION_WHATSAPP,msg);alert("✅ تم حفظ طلب الاشتراك وفتح واتساب.");subscriptionModal();
  }catch(e){console.error(e);alert("تعذر الاتصال بالخادم.\n\n"+(e.message||e))}
}

async function registerAppServiceWorker(){
  try{
    if(!('serviceWorker' in navigator)) return false;
    if(location.protocol!=='https:') return false;
    await navigator.serviceWorker.register('./sw.js');
    return true;
  }catch(e){console.warn('Service worker:',e);return false}
}
async function enablePhoneNotifications(){
  if(!('Notification' in window)){alert('هذا المتصفح لا يدعم إشعارات الهاتف.');return}
  if(location.protocol!=='https:'){
    alert('لتشغيل الإشعارات على الهاتف، افتح البرنامج من رابط HTTPS بعد نشره على الاستضافة. فتح ملف HTML مباشرة من التنزيلات لا يدعم الإشعارات بشكل كامل.');
    return;
  }
  try{
    const ok=await registerAppServiceWorker();
    if(!ok){alert('تعذر تجهيز خدمة الإشعارات.');return}
    const permission=await Notification.requestPermission();
    if(permission!=='granted'){alert('لم يتم السماح بالإشعارات. فعّلها من إعدادات المتصفح للهاتف ثم أعد المحاولة.');return}
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('مساعد المعلم', {body:'تم تفعيل إشعارات الهاتف بنجاح ✅',icon:'icon-192.png',badge:'icon-192.png',tag:'test-notification'});
    localStorage.setItem('emawe_notifications','enabled');
    alert('تم تفعيل إشعارات الهاتف بنجاح ✅');
  }catch(e){console.error(e);alert('حدث خطأ أثناء تفعيل الإشعارات: '+(e.message||e))}
}
function notificationsStatus(){return localStorage.getItem('emawe_notifications')==='enabled'?'مفعّلة':'غير مفعّلة'}

function pushBase64UrlToBytes(v){
  const pad='='.repeat((4-v.length%4)%4),b64=(v+pad).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(b64),out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
async function enableParentStudentNotifications(){
  if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window)){alert('هذا المتصفح لا يدعم إشعارات Push.');return}
  if(location.protocol!=='https:'){alert('الإشعارات تحتاج فتح الموقع من رابط HTTPS.');return}
  if(PUSH_WORKER_URL.includes('REPLACE-WITH-YOUR-PUSH-WORKER')){alert('ضع رابط Worker الإشعارات الحقيقي داخل PUSH_WORKER_URL أولًا.');return}
  const ctx=window.__publicStudentContext||{};
  if(!ctx.account_code||!ctx.student_code){alert('تعذر تحديد حساب الطالب. افتح رابط الطالب مرة أخرى.');return}
  try{
    const ok=await registerAppServiceWorker();
    if(!ok)throw new Error('تعذر تسجيل خدمة الإشعارات');
    const permission=await Notification.requestPermission();
    if(permission!=='granted')throw new Error('لم يتم السماح بالإشعارات');
    const reg=await navigator.serviceWorker.ready;
    const kr=await fetch(PUSH_WORKER_URL.replace(/\/$/,'')+'/vapid-public-key');
    const kj=await kr.json().catch(()=>({}));
    if(!kr.ok||!kj.publicKey)throw new Error(kj.error||'تعذر الحصول على VAPID public key');
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushBase64UrlToBytes(kj.publicKey)});
    const j=sub.toJSON(),keys=j.keys||{};
    const sr=await fetch(PUSH_WORKER_URL.replace(/\/$/,'')+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_code:ctx.account_code,student_code:ctx.student_code,endpoint:sub.endpoint,p256dh:keys.p256dh,auth:keys.auth})});
    const sj=await sr.json().catch(()=>({}));

async function publishStudentPublic(s){
  try{

    const grp=group(s.groupId);
    const st=stats(s.id);

      id:g.id, exam:g.exam||"امتحان", score:Number(g.score||0), total:Number(g.total||0),
      date:g.date||"", imageUrl:g.imageUrl||""
    }));
    const payments=(db.payments||[]).filter(p=>p.studentId===s.id);
    const attendance=(db.attendance||[]).filter(a=>a.studentId===s.id);
    const teacher_info={
      teacherName:db.settings?.teacherName||"",
      teacherPhone:db.settings?.teacherPhone||"",
      centerName:db.settings?.centerName||"",
      teacherSubject:db.settings?.teacherSubject||"",
      teacherInstructions:db.settings?.teacherInstructions||""
    };
    const financial={
      paid: payments.reduce((a,p)=>a+Number(p.amount||p.paid||0),0),
      total: Number(s.fees||s.monthlyFee||0)
    };
    financial.remaining=Math.max(0,financial.total-financial.paid);
    const row={
      student_code:s.studentCode,
      account_code:db.account?.code||"",
      student_name:s.name||"",
      parent_name:s.parent||"",
      level:s.level||"",

      teacher_info:teacher_info
    };
    const {error}=await supabaseClient.rpc("publish_student_public", {p_row:row});

    return true;
  }catch(e){ console.error("publish student exception:",e); return false; }
}

      level:data.level||'',
      notes:data.notes||'',
      group:obj(data.group_name)?data.group_name:null
    };
    // group_name is normally text in this view, so normalize it to the shape renderParent expects.

  async function uploadBlobDirect(blob, path){
    const cleanPath=String(path).replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
    const objectUrl=SUPABASE_URL+'/storage/v1/object/'+STORAGE_BUCKET+'/'+cleanPath;
    const publicUrl=SUPABASE_URL+'/storage/v1/object/public/'+STORAGE_BUCKET+'/'+cleanPath;
    const headers={
      'apikey':SUPABASE_PUBLISHABLE_KEY,
      'Content-Type':blob.type||'image/jpeg',
      'x-upsert':'true',
      'cache-control':'3600'
    };
    let lastError='';
    for(const method of ['POST','PUT']){
      try{
        const controller=new AbortController();
        const timer=setTimeout(()=>controller.abort(),20000);
        const res=await fetch(objectUrl,{method,headers,body:blob,signal:controller.signal});
        clearTimeout(timer);
        if(res.ok) return publicUrl;
        const body=await res.text().catch(()=> '');
        lastError='Storage upload '+res.status+(body?' - '+body.slice(0,220):'');

        lastError=e?.name==='AbortError'?'انتهت مهلة رفع الصورة':(e?.message||String(e));

      const publishedAfterImages=await publishStudentPublic(s);

        alert('تم تجهيز روابط الصور، لكن تعذر تحديث صفحة الطالب. لم يتم فتح واتساب حتى لا يتم إرسال بيانات غير مكتملة.');
        return;
      }
      openWhatsAppLinkOnly(s.phone,parentTextWithLinks(s,grades));
    }catch(e){
      console.error('Parent link-only error',e);
      alert('تعذر تجهيز روابط صور الامتحانات: '+(e.message||e));
    }finally{
      if(active){active.disabled=false;active.textContent=active.dataset.oldText||'واتساب ولي الأمر';}
    }
  };
  window.APK_PARENT_LINK_MODE=APK_PARENT_LINK_MODE;

  /* ===== v20: finance + groups + exam enhancements ===== */
  window.paymentSummary=function paymentSummary(ym=monthKey(today())){
    const students=db.students||[];
    let full=0,partial=0,unpaid=0,exempt=0,expected=0,collected=0;
    students.forEach(s=>{
      const fee=Math.max(0,Number(s.monthlyFee||0));
      const rows=(db.payments||[]).filter(p=>p.studentId===s.id&&monthKey(p.date||p.month||today())===ym);
      const paid=rows.reduce((a,p)=>a+Number(p.amount||0),0);
      const discount=rows.reduce((a,p)=>a+Number(p.discount||0),0);
      const ex=rows.some(p=>p.status==='exempt');
      const due=Math.max(0,fee-discount);
      expected+=due; collected+=Math.min(paid,due);
      if(ex){exempt++;return}
      if(due===0){full++;return}
      if(paid>=due){full++;}else if(paid>0){partial++;}else{unpaid++;}
    });
    return {full,partial,unpaid,exempt,expected,collected,fullPaidPct:students.length?Math.round(full/students.length*100):0,collectionPct:expected?Math.round(collected/expected*100):0,total:students.length};
  }
  function monthlyPaymentRows(studentId,ym=monthKey(today())){return (db.payments||[]).filter(p=>p.studentId===studentId&&monthKey(p.date||p.month||today())===ym)}
  function monthlyPaymentState(s,ym=monthKey(today())){
    const fee=Math.max(0,Number(s?.monthlyFee||0));
    const rows=monthlyPaymentRows(s.id,ym); const paid=rows.reduce((a,p)=>a+Number(p.amount||0),0);
    const discount=rows.reduce((a,p)=>a+Number(p.discount||0),0); const due=Math.max(0,fee-discount);
    const exempt=rows.some(p=>p.status==='exempt');
    const state=exempt?'exempt':due===0||paid>=due?'paid':paid>0?'partial':'unpaid';
    return {fee,paid,discount,due,remaining:Math.max(0,due-paid),state,rows};
  }
  function paymentBadge(state){return state==='paid'?'<span class="badge green">✓ مدفوع كامل</span>':state==='partial'?'<span class="badge" style="background:#fff3df;color:#b45309">💰 دفع جزئي</span>':state==='exempt'?'<span class="badge purple">🎁 معفى</span>':'<span class="badge red">✕ غير مسدد</span>'}
  function openPaymentActions(id){
    const s=student(id); if(!s)return; const ym=monthKey(today()),st=monthlyPaymentState(s,ym);
    $('modalBody').innerHTML=`<h2>💰 إدارة سداد ${esc(s.name)}</h2><div class="success-info">الشهر: <b>${ym}</b><br>الاشتراك الشهري: <b>${money(st.fee)}</b><br>الحالة الحالية: ${paymentBadge(st.state)}<br>المدفوع: <b>${money(st.paid)}</b> — المتبقي: <b>${money(st.remaining)}</b></div>
      <div class="payment-menu">
       <button onclick="setStudentPayment('${id}','paid')">✅ دفع كامل (تم السداد بالكامل)</button>
       <button onclick="setStudentPayment('${id}','discount')">🏷️ تسجيل خصم للطالب</button>
       <button onclick="setStudentPayment('${id}','partial')">💰 دفع جزئي / تسجيل مبلغ متبقي</button>
       <button onclick="setStudentPayment('${id}','exempt')">🎁 إعفاء من الاشتراك (منحة / خصم كامل)</button>
       <button onclick="setStudentPayment('${id}','unpaid')">❌ إلغاء السداد (غير مسدد)</button>
      </div>`;openModal();
  }
  function upsertMonthlyPayment(id,patch,ym=monthKey(today())){
    const idx=(db.payments||[]).findIndex(p=>p.studentId===id&&monthKey(p.date||p.month||today())===ym);
    const base={id:uid('sp'),studentId:id,amount:0,total:Number(student(id)?.monthlyFee||0),date:today(),month:ym,note:''};
    if(idx>=0) db.payments[idx]={...db.payments[idx],...patch,month:ym}; else db.payments.push({...base,...patch});
  }
  function setStudentPayment(id,mode){
    const s=student(id);if(!s)return;const st=monthlyPaymentState(s),ym=monthKey(today());
    if(mode==='paid') upsertMonthlyPayment(id,{amount:st.due,total:st.fee,discount:0,status:'paid',note:'دفع كامل'} ,ym);
    else if(mode==='partial'){
      $('modalBody').innerHTML=`<h2>💰 دفع جزئي — ${esc(s.name)}</h2><div class="notice">المتبقي الحالي: <b>${money(st.remaining)}</b></div><label>المبلغ المدفوع الآن</label><input id="ppAmount" type="number" min="0" step="1" value="${st.remaining||''}"><label>ملاحظة</label><input id="ppNote" placeholder="مثال: دفع جزء من الاشتراك"><button class="btn success btn-wide" onclick="savePartialPayment('${id}')">💾 حفظ الدفع الجزئي</button>`;return;
    } else if(mode==='discount'){
      $('modalBody').innerHTML=`<h2>🏷️ خصم للطالب — ${esc(s.name)}</h2><label>قيمة الخصم بالجنيه</label><input id="discAmount" type="number" min="0" step="1" value="0"><label>المبلغ المدفوع بعد الخصم</label><input id="discPaid" type="number" min="0" step="1" value="${st.paid||0}"><label>ملاحظة</label><input id="discNote" placeholder="مثال: خصم أخوة / خصم خاص"><button class="btn primary btn-wide" onclick="saveDiscountPayment('${id}')">💾 حفظ الخصم</button>`;return;
    } else if(mode==='exempt') upsertMonthlyPayment(id,{amount:0,total:st.fee,discount:st.fee,status:'exempt',note:'إعفاء / منحة / خصم كامل'},ym);
    else if(mode==='unpaid') upsertMonthlyPayment(id,{amount:0,total:st.fee,discount:0,status:'unpaid',note:'تم إلغاء السداد'},ym);
    save();closeModal();financeView();home();
  }
  function savePartialPayment(id){const amount=Number($('ppAmount').value||0),s=student(id),st=monthlyPaymentState(s);if(amount<=0){alert('أدخل مبلغًا صحيحًا.');return}const next=Math.min(st.paid+amount,st.due);upsertMonthlyPayment(id,{amount:next,total:st.fee,discount:st.discount,status:next>=st.due?'paid':'partial',note:$('ppNote').value.trim()},monthKey(today()));save();closeModal();financeView();home();}
  function saveDiscountPayment(id){const s=student(id),discount=Math.min(Math.max(0,Number($('discAmount').value||0)),Number(s.monthlyFee||0));const paid=Math.max(0,Number($('discPaid').value||0));const due=Math.max(0,Number(s.monthlyFee||0)-discount);upsertMonthlyPayment(id,{amount:Math.min(paid,due),total:Number(s.monthlyFee||0),discount,status:paid>=due?'paid':paid>0?'partial':'unpaid',note:$('discNote').value.trim()||'خصم للطالب'},monthKey(today()));save();closeModal();financeView();home();}
  function financeStatusMatches(s,filter){const state=monthlyPaymentState(s).state;return filter==='all'||(filter==='paid'&&state==='paid')||(filter==='partial'&&state==='partial')||(filter==='unpaid'&&state==='unpaid')||(filter==='exempt'&&state==='exempt')}
  window.financeFilter='all';
  function renderFinanceCards(){

  }
  window.financeView=function(){
    if(!ensureAccess())return;const sm=paymentSummary();let totalPaid=(db.payments||[]).filter(p=>monthKey(p.date||p.month||today())===monthKey(today())).reduce((a,p)=>a+Number(p.amount||0),0);
    $('finance').innerHTML=`<div class="hero"><h1>💰 المالية</h1><p>إدارة اشتراكات الطلاب ومتابعة السداد الفعلي للشهر الحالي.</p></div><div class="finance-stats"><div class="finance-stat"><small>إجمالي الطلاب</small><b>${sm.total}</b></div><div class="finance-stat"><small>مدفوع كامل</small><b>${sm.full}</b></div><div class="finance-stat"><small>دفع جزئي</small><b>${sm.partial}</b></div><div class="finance-stat"><small>نسبة الدفع الفعلي</small><b>${sm.fullPaidPct}%</b></div></div><div class="card"><div class="success-info">💵 المحصل هذا الشهر: <b>${money(totalPaid)}</b> — 📊 نسبة التحصيل المالي: <b>${sm.collectionPct}%</b></div></div><div class="card"><h3>🔐 اشتراك البرنامج</h3><div class="success-info">${trialInfo().paid?'الاشتراك مفعل على هذا الجهاز.':'النسخة التجريبية الحالية.'}</div><button class="btn primary btn-wide" onclick="subscriptionModal()">💳 إدارة اشتراك البرنامج</button></div><div class="finance-toolbar"><input id="financeSearch" class="search" placeholder="🔎 ابحث عن طالب بالاسم أو رقم الهاتف..." oninput="renderFinanceCards()"><button class="filter-btn active" onclick="financeSetFilter('all',this)">الكل (${sm.total})</button><button class="filter-btn" onclick="financeSetFilter('paid',this)">🟢 المسدد (${sm.full})</button><button class="filter-btn" onclick="financeSetFilter('unpaid',this)">🔴 غير المسدد (${sm.unpaid})</button><button class="filter-btn" onclick="financeSetFilter('partial',this)">🟠 جزئي (${sm.partial})</button></div><div id="financeStudents"></div>`;window.financeFilter='all';renderFinanceCards();

  function financeSetFilter(filter,btn){window.financeFilter=filter;document.querySelectorAll('.finance-toolbar .filter-btn').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');renderFinanceCards()}

  window.renderGroupCards=function(){

ل المجموعة</button><button class="btn whatsapp" onclick="sendGroupParentReport('${g.id}')">📨 إرسال لولي الأمر</button><button class="btn danger" onclick="deleteGroup('${g.id}')">🗑️ حذف</button></div></div>`}).join(''):`<div class="card empty">لا توجد مجموعات بعد.</div>`;

  window.gradeModal=function(id){

.pro-v22-card h3{margin:0 0 8px}.pro-v22-card .big{font-size:26px;font-weight:900;display:block}.pro-v22-card small{color:#6b7280}
.pro-v22-alerts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.pro-v22-alert{border-radius:18px;padding:13px;background:#fff8e8;border:1px solid #f0d68a}.pro-v22-alert.danger{background:#fff0f2;border-color:#f1c0c8}.pro-v22-alert.success{background:#effaf5;border-color:#b8e4d0}.pro-v22-alert .title{font-weight:900;margin-bottom:4px}
.pro-v22-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.pro-v22-tool{border:1px solid #dfe5ef;background:#fff;border-radius:20px;padding:14px;text-align:right;cursor:pointer}.pro-v22-tool b{display:block;font-size:16px;margin:5px 0}.pro-v22-tool span{font-size:12px;color:#6b7280}
.pro-v22-trend{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;margin-top:10px}
.pro-v22-bar{background:#2867df;border-radius:9px 9px 4px 4px;min-height:8px;position:relative}.pro-v22-bar small{position:absolute;bottom:-24px;right:50%;transform:translateX(50%);white-space:nowrap;color:#6b7280;font-size:10px}
.pro-v22-profile{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.pro-v22-list{display:grid;gap:7px}.pro-v22-row{display:flex;justify-content:space-between;gap:10px;padding:9px;border-bottom:1px solid #eef1f5}.pro-v22-row:last-child{border-bottom:0}
.pro-v22-chip{display:inline-block;border-radius:999px;padding:5px 9px;background:#f1f5ff;margin:2px;font-size:12px;font-weight:800}
@media(max-width:800px){.pro-v22-grid{grid-template-columns:1fr 1fr}.pro-v22-tools{grid-template-columns:1fr 1fr}.pro-v22-profile{grid-template-columns:1fr}}
@media(max-width:520px){.pro-v22-grid,.pro-v22-alerts,.pro-v22-tools{grid-template-columns:1fr}}
</style>

<script id="v22-professional-layer-script">
(function(){
"use strict";

function v22Label(map,v){return map[v]||"غير مسجل";}
function v22Today(){return typeof today==="function"?today():new Date().toISOString().slice(0,10);}
function v22FU(sid,date){return typeof followupRecord==="function"?(followupRecord(sid,date)||{}):{};}
function v22Students(){return Array.isArray(db.students)?db.students:[];}
function v22MonthPayments(){
  const mk=typeof monthKey==="function"?monthKey(v22Today()):v22Today().slice(0,7);
  return (db.payments||[]).filter(p=>(typeof monthKey==="function"?monthKey(p.date):String(p.date||"").slice(0,7))===mk);
}
function v22FullPaidCount(){
  return v22Students().filter(s=>{
    const fee=Number(s.monthlyFee||0);
    const paid=v22MonthPayments().filter(p=>p.studentId===s.id).reduce((a,p)=>a+Number(p.amount||p.paid||0),0);
    return fee>0 && paid>=fee;
  }).length;
}
function v22DailySummary(date){
  const ss=v22Students(), fu=ss.map(s=>v22FU(s.id,date));
  const count=k=>fu.filter(x=>x[k] && x[k]!=="pending").length;
  return {
    students:ss.length,
    present:fu.filter(x=>x.attendance==="present").length,
    absent:fu.filter(x=>x.attendance==="absent").length,
    homework:fu.filter(x=>x.homework==="done").length,
    recitation:fu.filter(x=>["excellent","good","needs"].includes(x.recitation)).length,
    level:count("level"),
    focus:count("focus")
  };
}
function v22Alerts(){
  const out=[];
  const date=v22Today(), ss=v22Students();
  ss.forEach(s=>{
    const rec=(db.dailyFollowup||[]).filter(x=>x.studentId===s.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const recent=rec.slice(0,3);
    const abs=recent.filter(x=>x.attendance==="absent").length;
    const nohw=recent.filter(x=>x.homework==="no").length;
    if(abs>=2) out.push({type:"danger",title:"⚠️ غياب متكرر",text:`${s.name}: غياب ${abs} مرات في آخر سجلات المتابعة.`});
    if(nohw>=2) out.push({type:"warning",title:"📚 الواجب يحتاج متابعة",text:`${s.name}: لم يتم تسجيل الواجب مكتملًا ${nohw} مرات مؤخرًا.`});
    if(recent[0]?.focus==="needs" || recent[0]?.level==="needs") out.push({type:"warning",title:"🎯 يحتاج متابعة",text:`${s.name}: التركيز أو المستوى يحتاج متابعة.`});
  });
  const unpaid=ss.filter(s=>Number(s.monthlyFee||0)>0 && (v22MonthPayments().filter(p=>p.studentId===s.id).reduce((a,p)=>a+Number(p.amount||p.paid||0),0)<Number(s.monthlyFee||0))).length;
  if(unpaid) out.push({type:"warning",title:"💳 متابعة السداد",text:`يوجد ${unpaid} طالبًا لم يسدد كامل الرسوم الشهرية.`});
  return out.slice(0,8);
}
function v22Trend(){
  const now=new Date(), arr=[];
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(now.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const s=v22DailySummary(key);
    arr.push({key,label:d.toLocaleDateString("ar-EG",{day:"numeric",month:"numeric"}),value:s.present});
  }
  return arr;
}
window.v22InsightsModal=function(){
  const s=v22DailySummary(v22Today()), alerts=v22Alerts(), trend=v22Trend();
  const max=Math.max(1,...trend.map(x=>x.value));
  $("modalBody").innerHTML=`
  <h2>📊 مركز التحليلات والمتابعة</h2>
  <div class="pro-v22-grid">
    <div class="pro-v22-card"><small>حاضر اليوم</small><span class="big">${s.present}</span></div>
    <div class="pro-v22-card"><small>غائب اليوم</small><span class="big">${s.absent}</span></div>
    <div class="pro-v22-card"><small>الواجب المكتمل</small><span class="big">${s.homework}</span></div>
    <div class="pro-v22-card"><small>تم التسميع</small><span class="big">${s.recitation}</span></div>
  </div>
  <div class="pro-v22-card"><h3>📈 الحضور — آخر 7 أيام</h3>
    <div class="pro-v22-trend">${trend.map(x=>`<div class="pro-v22-bar" style="height:${Math.max(8,Math.round(x.value/max*100))}%"><small>${esc(x.label)}</small></div>`).join("")}</div>
    <div style="height:28px"></div>
  </div>
  <div class="section-title">⚠️ التنبيهات الذكية</div>
  ${alerts.length?alerts.map(a=>`<div class="pro-v22-alert ${a.type==='danger'?'danger':''}"><div class="title">${esc(a.title)}</div><div>${esc(a.text)}</div></div>`).join(""):'<div class="card empty">لا توجد تنبيهات مهمة حاليًا ✅</div>'}
  <button class="btn primary btn-wide" onclick="closeModal()">إغلاق</button>`;
  openModal();
};

window.v22MessagesCenter=function(){
  const ss=v22Students();
  $("modalBody").innerHTML=`
  <h2>💬 مركز رسائل أولياء الأمور</h2>
  <div class="notice">اختر نوع الرسالة ثم الطالب. الرسائل تستخدم بيانات المتابعة الفعلية ولا تُنشئ أرقامًا وهمية.</div>
  <label>الطالب</label><select id="v22MsgStudent">${ss.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select>
  <div class="pro-v22-tools">
    <button class="pro-v22-tool" onclick="v22SendSelected('daily')">📋<b>تقرير اليوم</b><span>الحضور والواجب والتسميع والمستوى والتركيز</span></button>
    <button class="pro-v22-tool" onclick="v22SendSelected('full')">📊<b>تقرير شامل</b><span>ملخص الطالب + الامتحانات + المالية</span></button>
    <button class="pro-v22-tool" onclick="v22SendSelected('link')">🔗<b>رابط الطالب</b><span>نسخ الرابط الثابت</span></button>
  </div>`;
  openModal();
};
window.v22SendSelected=function(type){
  const id=$("v22MsgStudent")?.value, s=student(id); if(!s)return;
  if(type==="link"){copyShare(id);return;}
  if(type==="daily"){sendDailyParentReport(id,v22Today());return;}
  if(typeof sendParentFinal==="function"){sendParentFinal(id);return;}
  if(typeof parentTextWithLinks==="function"){openWhatsAppLinkOnly(s.phone,parentTextWithLinks(s, (db.grades||[]).filter(g=>g.studentId===id)));return;}
};

window.v22Backup=function(){
  try{
    const payload={version:"v22",exportedAt:new Date().toISOString(),db};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mosaed-almoalem-backup-"+v22Today()+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){alert("تعذر إنشاء النسخة الاحتياطية: "+(e.message||e));}
};

window.v22StudentProfile=function(id){
  const s=student(id); if(!s)return;
  const fu=(db.dailyFollowup||[]).filter(x=>x.studentId===id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const grades=(db.grades||[]).filter(x=>x.studentId===id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const payments=(db.payments||[]).filter(x=>x.studentId===id);
  const fee=Number(s.monthlyFee||0), paid=v22MonthPayments().filter(p=>p.studentId===id).reduce((a,p)=>a+Number(p.amount||p.paid||0),0);
  const avgFocus=fu.filter(x=>x.focus&&x.focus!=="pending").length;
  $("modalBody").innerHTML=`
  <h2>👨‍🎓 ملف الطالب الاحترافي</h2>
  <div class="pro-v22-profile">
    <div class="pro-v22-card"><h3>${esc(s.name)}</h3><div class="pro-v22-chip">${esc(groupTitle(s.groupId))}</div><div class="pro-v22-chip">${esc(s.level||"لم يحدد")}</div>
      <div class="pro-v22-list">
        <div class="pro-v22-row"><span>ولي الأمر</span><b>${esc(s.parent||"غير مسجل")}</b></div>
        <div class="pro-v22-row"><span>الهاتف</span><b>${esc(s.phone||"غير مسجل")}</b></div>
        <div class="pro-v22-row"><span>المتابعات</span><b>${fu.length}</b></div>
        <div class="pro-v22-row"><span>الامتحانات</span><b>${grades.length}</b></div>
      </div>
    </div>
    <div class="pro-v22-card"><h3>💳 الوضع المالي</h3><div class="pro-v22-row"><span>الرسوم</span><b>${money(fee)}</b></div><div class="pro-v22-row"><span>المدفوع هذا الشهر</span><b>${money(paid)}</b></div><div class="pro-v22-row"><span>المتبقي</span><b>${money(Math.max(0,fee-paid))}</b></div>
      <button class="btn primary btn-wide" onclick="openPaymentActions('${id}')">💰 إدارة السداد</button>
    </div>
  </div>
  <div class="section-title">📅 آخر المتابعات</div>
  ${fu.slice(0,8).map(r=>`<div class="pro-v22-card"><b>${esc(r.date)}</b><div>${['attendance','homework','recitation','level','focus'].map(k=>`<span class="pro-v22-chip">${esc(k)}: ${esc(v22Label({present:"حاضر",absent:"غائب",done:"تم",no:"لم يتم",excellent:"ممتاز",good:"جيد",needs:"يحتاج متابعة",verygood:"جيد جدًا",acceptable:"مقبول",medium:"متوسط",pending:"غير مسجل"},r[k]))}</span>`).join("")}</div>${r.notes?`<p>📝 ${esc(r.notes)}</p>`:""}</div>`).join("")||'<div class="card empty">لا توجد متابعات.</div>'}
  <div class="section-title">📊 آخر النتائج</div>
  ${grades.slice(0,6).map(g=>`<div class="pro-v22-row"><span>${esc(g.exam||"امتحان")} — ${esc(g.date||"")}</span><b>${Number(g.score||0)}/${Number(g.total||0)}</b></div>`).join("")||'<div class="card empty">لا توجد نتائج.</div>'}
  <div class="report-actions">
    <button class="btn primary" onclick="copyShare('${id}')">🔗 نشر/نسخ الرابط</button>
    <button class="btn whatsapp" onclick="sendParentFinal('${id}')">💬 رسالة ولي الأمر</button>
    <button class="btn secondary" onclick="v22Backup()">☁️ نسخة احتياطية</button>
  </div>`;
  openModal();
};

window.v22DailySnapshot=function(){
  const date=v22Today(), s=v22DailySummary(date);
  alert(`ملخص اليوم ${date}\n\n👨‍🎓 الطلاب: ${s.students}\n🟢 الحضور: ${s.present}\n🔴 الغياب: ${s.absent}\n📚 الواجب: ${s.homework}\n🗣️ التسميع: ${s.recitation}`);
};

window.v22EnhanceHome=function(){
  const homeBox=$("home"); if(!homeBox)return;
  const s=v22DailySummary(v22Today()), alerts=v22Alerts(), full=v22FullPaidCount();
  const alertsHtml=alerts.length?alerts.slice(0,4).map(a=>`<div class="pro-v22-alert ${a.type==='danger'?'danger':''}"><div class="title">${esc(a.title)}</div><div>${esc(a.text)}</div></div>`).join(""):'<div class="pro-v22-alert success"><div class="title">✅ الوضع مستقر</div><div>لا توجد تنبيهات مهمة حاليًا.</div></div>';
  homeBox.insertAdjacentHTML("beforeend",`
    <div class="section-title">⚡ مركز الإدارة الاحترافي</div>
    <div class="pro-v22-grid">
      <div class="pro-v22-card"><small>👨‍🎓 الطلاب</small><span class="big">${s.students}</span></div>
      <div class="pro-v22-card"><small>🟢 حاضر اليوم</small><span class="big">${s.present}</span></div>
      <div class="pro-v22-card"><small>📚 الواجب اليوم</small><span class="big">${s.homework}</span></div>
      <div class="pro-v22-card"><small>💳 سداد كامل</small><span class="big">${full}</span></div>
    </div>
    <div class="pro-v22-alerts">${alertsHtml}</div>
    <div class="pro-v22-tools">
      <button class="pro-v22-tool" onclick="v22InsightsModal()">📈<b>التحليلات والتنبيهات</b><span>تطور الحضور والتنبيهات الذكية</span></button>
      <button class="pro-v22-tool" onclick="v22MessagesCenter()">💬<b>مركز رسائل أولياء الأمور</b><span>تقرير اليوم أو التقرير الشامل</span></button>
      <button class="pro-v22-tool" onclick="v22Backup()">☁️<b>نسخة احتياطية</b><span>حفظ نسخة من بيانات البرنامج على الجهاز</span></button>
    </div>
  `);
};

// Add a professional shortcut to the students screen without replacing its existing UI.
window.v22PatchStudentCards=function(){
  const box=$("students"); if(!box || box.dataset.v22==="1")return;
  box.dataset.v22="1";
  const cards=box.querySelectorAll(".group-card");
  cards.forEach(card=>{
    const btns=card.querySelector(".actions");
    if(!btns)return;
    const onclicks=[...btns.querySelectorAll("button")].map(b=>b.getAttribute("onclick")||"");
    const m=onclicks.join(" ");
    const idMatch=m.match(/studentDetails\(['"]([^'"]+)['"]\)/);
    if(idMatch) btns.insertAdjacentHTML("afterbegin",`<button type="button" class="btn secondary" onclick="v22StudentProfile('${idMatch[1]}')">📊 الملف</button>`);
  });
};

const _v22Home=window.home;
window.home=function(){
  const r=_v22Home.apply(this,arguments);
  setTimeout(v22EnhanceHome,0);
  return r;
};

const _v22StudentsView=window.studentsView;
if(typeof _v22StudentsView==="function"){
  window.studentsView=function(){
    const r=_v22StudentsView.apply(this,arguments);
    setTimeout(v22PatchStudentCards,0);
    return r;
  };
}

// Public student page: add a visible last-update badge and richer daily history if renderParent is used.
const _v22RenderParent=window.renderParent;
if(typeof _v22RenderParent==="function"){
  window.renderParent=function(data){
    const r=_v22RenderParent.apply(this,arguments);
    setTimeout(()=>{
      const root=document.body;
      if(!root)return;
      const history=data&&Array.isArray(data.dailyFollowup)?data.dailyFollowup:[];
      const existing=root.querySelector(".v22-public-update");
      if(!existing){
        const host=root.querySelector(".parent-page,.parent-wrap,.page")||root.firstElementChild;
        if(host){
          const last=history.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
          host.insertAdjacentHTML("afterbegin",`<div class="v22-public-update" style="margin:10px 0;padding:10px 14px;border-radius:14px;background:#effaf5;border:1px solid #b8e4d0;font-weight:800">🔄 آخر تحديث للمتابعة: ${esc(last?.date||"غير مسجل")}</div>`);
        }
      }
    },0);
    return r;
  };
}

})();
</script>
